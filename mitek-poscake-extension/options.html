<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Mitek ghi âm – Tuỳ chọn</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 28px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    small { display: block; color: #777; font-weight: 400; }
    input[type=text], input[type=password], input[type=number], textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    .row { display: flex; gap: 8px; margin-top: 20px; align-items: center; flex-wrap: wrap; }
    button { padding: 8px 14px; border-radius: 6px; border: 1px solid #1677ff; background: #1677ff; color: #fff; cursor: pointer; }
    button.sec { background: #fff; color: #1677ff; }
    pre { background: #f6f6f6; padding: 10px; border-radius: 6px; max-height: 360px; overflow: auto; white-space: pre-wrap; }
    #msg { font-weight: 600; }
  </style>
</head>
<body>
  <h1>🎧 Mitek ghi âm cho POScake – Tuỳ chọn</h1>

  <h2>1. Kết nối Mitek</h2>
  <label>MITEK_URL
    <small>Địa chỉ tổng đài Mitek cấp (phần trước <code>/cdr/getCallsLog</code>). VD: https://abc.mitek.vn</small>
    <input type="text" id="mitekUrl"></label>
  <label>Secret <small>Mã secret do Mitek cấp.</small>
    <input type="password" id="secret" autocomplete="off"></label>
  <label>Số ngày tra cứu gần nhất <input type="number" id="lookbackDays" min="1"></label>
  <label>Số trang tối đa (mỗi trang 100 cuộc gọi, mỗi chiều) <input type="number" id="maxPages" min="1"></label>

  <h2>2. File ghi âm</h2>
  <label><input type="checkbox" id="sendCookies"> Dùng phiên đăng nhập Mitek trên Chrome khi tải ghi âm
    <small>Bật nếu link ghi âm chỉ nghe được khi đã đăng nhập Mitek. Nhân viên cần đăng nhập Mitek trên Chrome này.</small></label>
  <label>Tên miền chứa file ghi âm
    <small>Tự điền sau khi bấm "Thử kết nối". Mỗi dòng một địa chỉ, VD: https://rec.mitek.vn</small>
    <textarea id="extraOrigins" rows="2"></textarea></label>

  <h2>3. POScake</h2>
  <label>CSS selector vùng chứa SĐT khách trên trang đơn hàng (không bắt buộc)
    <small>Để trống thì extension tự dò SĐT trong cửa sổ chi tiết đơn đang mở.</small>
    <input type="text" id="phoneSelector"></label>

  <div class="row">
    <button id="save">Lưu</button>
    <input type="text" id="testPhone" placeholder="SĐT khách để thử" style="width:170px">
    <button class="sec" id="test">Thử kết nối</button>
    <button class="sec" id="grant" hidden>Cấp quyền nghe ghi âm</button>
    <span id="msg"></span>
  </div>
  <pre id="out" hidden></pre>

  <script src="lib/defaults.js"></script>
  <script src="lib/utils.js"></script>
  <script src="options.js"></script>
</body>
</html>
