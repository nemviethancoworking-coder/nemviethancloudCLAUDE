const fmt = s => { if(!s) return ''; const d = typeof s === 'string' ? fromISO(s.slice(0,10)) : s; return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };

function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  return { week: Math.ceil(((t - Date.UTC(y,0,1)) / 864e5 + 1) / 7), year: y };
}
function weekStart(week, year){ const j4 = new Date(year,0,4); const day = j4.getDay() || 7; return addDays(addDays(j4, 1-day), (week-1)*7); }

// URL Apps Script dùng mặc định cho cả team (có thể ghi đè trong Cài đặt đồng bộ; để trống = chế độ cục bộ).
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbx_BEECWvgjzcw30IuZ1JlyE2NohY7PNO_GE7q55g7bBU3USVXOrG9ujxFo5dkvMGvSZw/exec';
const apiUrl = () => { const v = localStorage.getItem(API_KEY); return (v === null ? DEFAULT_API : v).trim(); };

function setBusy(b){ sync.busy = b; const el = document.getElementById('sync-dot'); if(el) el.className = syncDotClass(); }
const syncDotClass = () => 'w-2 h-2 rounded-full shrink-0 ' + (!online() ? 'bg-gray-400' : sync.error ? 'bg-red-500' : sync.busy ? 'bg-amber-400 animate-pulse' : 'bg-green-500');
async function apiFetch(url, opts){
  const res = await fetch(url, opts);
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch(e){ throw new Error('Phản hồi không hợp lệ (kiểm tra lại URL Web App và quyền "Bất kỳ ai").'); }
  if(!j.ok) throw new Error(j.error || 'Lỗi máy chủ');
  return j;
}
async function apiLoad(){
  if(!online()) return;
  setBusy(true);
  try { const j = await apiFetch(apiUrl() + (apiUrl().includes('?') ? '&' : '?') + 't=' + Date.now()); DB = j.db; save(); sync.error = null; sync.lastAt = new Date(); }
  catch(e){ sync.error = e.message; throw e; }
  finally { setBusy(false); }
}
async function api(action, payload){
  // POST không đặt Content-Type để tránh preflight CORS; Apps Script vẫn đọc được body.
  const j = await apiFetch(apiUrl(), { method:'POST', body: JSON.stringify({ action, payload }) });
  if(j.db){ DB = j.db; save(); sync.error = null; sync.lastAt = new Date(); }
  return j;
}
/* Áp dụng thay đổi ngay tại máy (localFn), rồi đẩy lên Sheet nếu đang bật đồng bộ. */
async function mutate(action, payload, localFn, successMsg){
  localFn(); save(); render();
  if(successMsg) toast(successMsg);
  if(!online()) return;
  setBusy(true);
  try { await api(action, payload); render(); }
  catch(e){ sync.error = e.message; toast('Không ghi được lên Google Sheet: ' + e.message, 'error'); try { await apiLoad(); } catch(_){} render(); }
  finally { setBusy(false); }
}

  if(!online()) return;

  catch(e){ if(!silent) toast(e.message, 'error'); render(); }
}

/* ---------- Tính toán OKR ---------- */
const krPct = k => k.target > 0 ? Math.min(100, Math.round(k.current / k.target * 100)) : 0;
const okrPct = o => o.krs.length ? Math.round(o.krs.reduce((a,k) => a + krPct(k), 0) / o.krs.length) : 0;
function cycleInfo(){
  const s = fromISO(DB.cycle.start), e = addDays(fromISO(DB.cycle.end), 1), n = new Date();
  const total = (e - s) / 864e5; const el = Math.min(Math.max((n - s) / 864e5, 0), total);
  return { expected: Math.round(el / total * 100), daysLeft: Math.max(0, Math.ceil((e - n) / 864e5)), status: n < s ? 'Sắp bắt đầu' : n >= e ? 'Đã kết thúc' : 'Đang diễn ra' };
}
function okrStatus(pct){
  const ex = cycleInfo().expected;
  if(pct >= 100) return { t:'Hoàn thành', c:'bg-emerald-50 text-emerald-700 border-emerald-200', bar:'bg-emerald-500' };
  if(pct >= ex - 10) return { t:'Đúng tiến độ', c:'bg-green-50 text-green-700 border-green-200', bar:'bg-green-500' };
  if(pct >= ex - 25) return { t:'Cần chú ý', c:'bg-amber-50 text-amber-700 border-amber-200', bar:'bg-amber-500' };
  return { t:'Rủi ro', c:'bg-red-50 text-red-700 border-red-200', bar:'bg-red-500' };
}
function reportStatus(r){
  const mc = r.comments.filter(c => isMgrId(c.authorId));
  if(!mc.length) return { t:'Chờ quản lý phản hồi', c:'bg-amber-50 text-amber-700 border-amber-200', key:'pending' };
  if(mc.some(c => !c.acknowledged)) return { t:'Chờ nhân viên xác nhận', c:'bg-blue-50 text-blue-700 border-blue-200', key:'ack' };
  return { t:'Đã xác nhận', c:'bg-green-50 text-green-700 border-green-200', key:'done' };
}
const TASK_STATUS = { todo:{ t:'Cần làm', c:'bg-slate-100 text-slate-700 border-slate-200' }, doing:{ t:'Đang làm', c:'bg-blue-50 text-blue-700 border-blue-200' }, done:{ t:'Hoàn thành', c:'bg-green-50 text-green-700 border-green-200' } };
const badge = (t,c) => `<span class="badge ${c}">${t}</span>`;
const isOverdue = t => t.status !== 'done' && t.due && t.due < toISO(new Date());
function pendingCount(){
  if(isMgr()) return DB.reports.filter(r => reportStatus(r).key === 'pending').length;
  return DB.reports.filter(r => r.userId === me().id).reduce((a,r) => a + r.comments.filter(c => isMgrId(c.authorId) && !c.acknowledged).length, 0);
}

/* ---------- Báo cáo tuần ---------- */
function visibleReports(){
  let rs = isMgr() ? DB.reports : DB.reports.filter(r => r.userId === me().id);
  if(state.ckUser !== 'all') rs = rs.filter(r => r.userId === state.ckUser);
  if(state.ckWeek !== 'all') rs = rs.filter(r => weekKey(r.week, r.year) === state.ckWeek);
  return [...rs].sort((a,b) => (b.year - a.year) || (b.week - a.week) || b.createdAt.localeCompare(a.createdAt));
}
function viewCheckin(){
  const cw = isoWeek(new Date());
  const rs = visibleReports();
  if(state.reportId && !rs.find(r => r.id === state.reportId)) state.reportId = null;
  if(!state.reportId && rs.length) state.reportId = rs[0].id;
  const weeks = [...new Set((isMgr() ? DB.reports : DB.reports.filter(r => r.userId === me().id)).map(r => weekKey(r.week, r.year)))].sort().reverse();
  const sel = DB.reports.find(r => r.id === state.reportId);

  <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">

        ${weeks.map(w => { const [y, ww] = w.split('-W'); return `<option value="${w}" ${state.ckWeek === w ? 'selected' : ''}>${weekLabel(+ww, +y)}</option>`; }).join('')}
      </select>

        ${rs.length ? rs.map(r => { const u = user(r.userId), o = DB.okrs.find(o => o.id === r.okrId) || {title:'(OKR đã xoá)'}, st = reportStatus(r); return `

          </div>
          <div class="text-[12.5px] text-slate-600 mt-2 truncate">${esc(o.title)}</div>
          <div class="mt-2 flex items-center justify-between">${badge(st.t, st.c)}<span class="text-[11px] text-gray-400 flex items-center gap-1">${I.chat} ${r.comments.length}</span></div>
        </div>`; }).join('') : `<div class="p-8 text-center text-gray-400 text-[13px]">Chưa có báo cáo nào.${!isMgr() ? '<br>Bấm "Tạo báo cáo" để bắt đầu.' : ''}</div>`}

        ${r.solutions.length ? `<div class="border border-gray-200 rounded-lg divide-y divide-gray-100">${r.solutions.map(s => { const t = DB.tasks.find(t => t.reportId === r.id && t.solutionId === s.id); const ts = t ? TASK_STATUS[t.status] : null; return `

      </div>
      <div class="border-t border-gray-200 pt-5">

          ${r.comments.length ? r.comments.map(c => { const a = user(c.authorId), mgr = isMgrId(c.authorId); return `

/* ---------- Quản lý công việc ---------- */
function viewTasks(){
  let ts = isMgr() ? DB.tasks : DB.tasks.filter(t => t.assigneeId === me().id);
  if(state.taskUser !== 'all') ts = ts.filter(t => t.assigneeId === state.taskUser);
  const counts = { all: ts.length, todo: ts.filter(t => t.status === 'todo').length, doing: ts.filter(t => t.status === 'doing').length, done: ts.filter(t => t.status === 'done').length, overdue: ts.filter(isOverdue).length };
  if(state.taskStatus !== 'all') ts = state.taskStatus === 'overdue' ? ts.filter(isOverdue) : ts.filter(t => t.status === state.taskStatus);
  const order = { todo:0, doing:1, done:2 };
  ts = [...ts].sort((a,b) => (order[a.status] - order[b.status]) || (a.due || '9').localeCompare(b.due || '9'));
  const tab = (key, label, cnt, cls='') => `<span class="chip ${state.taskStatus === key ? 'active' : ''} ${cls}" onclick="A.set('taskStatus','${key}')">${label} <span class="opacity-70">${cnt}</span></span>`;
  const stat = (label, value, color='text-slate-900') => `<div class="card p-4"><div class="text-[12.5px] text-gray-500">${label}</div><div class="text-2xl font-semibold mt-1 ${color}">${value}</div></div>`;
  return `
  <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-5">
    ${stat('Tổng công việc', counts.all)}${stat('Cần làm', counts.todo)}${stat('Đang làm', counts.doing, 'text-blue-600')}${stat('Hoàn thành', counts.done, 'text-green-600')}${stat('Quá hạn', counts.overdue, counts.overdue ? 'text-red-600' : 'text-green-600')}
  </div>
  <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
    <div class="flex items-center gap-2 flex-wrap">
      ${tab('all','Tất cả',counts.all)}${tab('todo','Cần làm',counts.todo)}${tab('doing','Đang làm',counts.doing)}${tab('done','Hoàn thành',counts.done)}${tab('overdue','Quá hạn',counts.overdue)}
      ${isMgr() ? `<select class="input !w-auto ml-2" onchange="A.set('taskUser',this.value)"><option value="all">Tất cả nhân viên</option>${employees().map(u => `<option value="${u.id}" ${state.taskUser === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>` : ''}
    </div>
    <button class="btn btn-primary" onclick="A.openTaskForm()">${I.plus} Thêm công việc</button>
  </div>
  <div class="card overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-50 text-gray-500 text-[12px] uppercase tracking-wide">
        <tr><th class="w-10 py-2.5"></th><th class="text-left font-medium py-2.5 px-2">Công việc</th>${isMgr() ? '<th class="text-left font-medium py-2.5 px-2">Người làm</th>' : ''}<th class="text-left font-medium py-2.5 px-2">Nguồn</th><th class="text-left font-medium py-2.5 px-2">Hạn</th><th class="text-left font-medium py-2.5 px-2 w-36">Trạng thái</th><th class="w-12"></th></tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        ${ts.length ? ts.map(t => { const u = user(t.assigneeId), o = DB.okrs.find(o => o.id === t.okrId), od = isOverdue(t); const can = isMgr() || t.assigneeId === me().id; return `
        <tr class="hover:bg-gray-50 ${t.status === 'done' ? 'opacity-70' : ''}">
          <td class="text-center py-3"><input type="checkbox" class="checkbox align-middle" ${t.status === 'done' ? 'checked' : ''} ${can ? `onchange="A.toggleTask('${t.id}')"` : 'disabled'}></td>
          <td class="py-3 px-2"><div class="font-medium ${t.status === 'done' ? 'line-through text-gray-400' : 'text-slate-900'}">${esc(t.title)}</div>${o ? `<div class="text-[12px] text-gray-500 mt-0.5 flex items-center gap-1">${I.flag} ${esc(o.title)}</div>` : ''}</td>
          ${isMgr() ? `<td class="py-3 px-2"><div class="flex items-center gap-2">${avatar(u, 'w-6 h-6 text-[10px]')}<span class="text-slate-700 whitespace-nowrap">${esc(u.name)}</span></div></td>` : ''}
          <td class="py-3 px-2 text-[12.5px] text-gray-500 whitespace-nowrap">${t.reportId ? `<a class="text-base-600 hover:underline cursor-pointer" onclick="A.gotoReport('${t.reportId}')">Báo cáo ${weekLabel(t.week, t.year, true)}</a>` : 'Thêm thủ công'}</td>
          <td class="py-3 px-2 text-[12.5px] whitespace-nowrap ${od ? 'text-red-600 font-medium' : 'text-slate-700'}">${t.due ? fmt(t.due) : '—'}${od ? ' · Quá hạn' : ''}</td>
          <td class="py-3 px-2">${can ? `<select class="input !py-1 !px-2 text-[12.5px]" onchange="A.setTaskStatus('${t.id}',this.value)">${Object.entries(TASK_STATUS).map(([k,v]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${v.t}</option>`).join('')}</select>` : badge(TASK_STATUS[t.status].t, TASK_STATUS[t.status].c)}</td>
          <td class="py-3 text-center">${can ? `<button class="text-gray-400 hover:text-red-600 p-1" title="Xoá" onclick="A.deleteTask('${t.id}')">${I.trash}</button>` : ''}</td>
        </tr>`; }).join('') : `<tr><td colspan="7" class="p-10 text-center text-gray-400">Không có công việc nào.</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

/* ---------- Hành động ---------- */
const A = {
  nav(v){ state.view = v; render(); },
  set(k, v){ state[k] = v; if(k === 'ckWeek' || k === 'ckUser') state.reportId = null; render(); },
  closeModal(){ document.getElementById('modal').innerHTML = ''; },
  fillLogin(un){ const u = DB.users.find(u => u.username === un); document.getElementById('lg-user').value = un; document.getElementById('lg-pass').value = u.password || ''; document.getElementById('lg-pass').focus(); },
  async login(){
    const un = document.getElementById('lg-user').value.trim(), pw = document.getElementById('lg-pass').value;
    const err = document.getElementById('lg-err'), btn = document.getElementById('lg-btn');
    const fail = m => { err.textContent = m; err.classList.remove('hidden'); };
    let u;
    if(online()){
      btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
      try { const j = await api('login', { username:un, password:pw }); u = j.user; }
      catch(e){ btn.disabled = false; btn.textContent = 'Đăng nhập'; return fail(e.message); }
    } else {
      u = DB.users.find(u => u.username === un && u.password === pw);
      if(!u) return fail('Sai tên đăng nhập hoặc mật khẩu.');
    }
    localStorage.setItem(SESSION_KEY, u.id); state = { ...state, view:'dashboard', reportId:null, dashUser:'all', ckUser:'all', ckWeek:'all', taskStatus:'all', taskUser:'all' };
    render(); toast(`Xin chào, ${u.name}!`, 'info');
  },
  logout(){ localStorage.removeItem(SESSION_KEY); render(); },
  refresh(){ refreshFromServer(false); },
  openSettings(){
    openModal(`
      ${modalHeader('Cài đặt đồng bộ Google Sheet', 'Nhiều người dùng chung một bộ dữ liệu qua Google Sheet + Apps Script.')}
      <div class="p-6 space-y-4">
        <div>
          <label class="label">URL Ứng dụng web (Apps Script)</label>
          <input id="st-url" class="input" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(apiUrl())}">
          <p class="text-[12px] text-gray-500 mt-1.5">Để trống và bấm Lưu để dùng chế độ cục bộ (dữ liệu mẫu, chỉ lưu trên trình duyệt này).${DEFAULT_API && apiUrl() !== DEFAULT_API ? ` <a class="text-base-600 hover:underline cursor-pointer" onclick="document.getElementById('st-url').value='${esc(DEFAULT_API)}'">Dùng lại URL mặc định của team</a>` : ''}</p>
        </div>
        <div id="st-status" class="text-[13px] hidden"></div>
        <details class="text-[12.5px] text-gray-600">
          <summary class="cursor-pointer font-medium text-slate-700">Hướng dẫn thiết lập (5 phút)</summary>
          <ol class="list-decimal ml-5 mt-2 space-y-1">
            <li>Mở Google Sheet <b>OKR Weekly - Data</b> → <b>Tiện ích mở rộng → Apps Script</b>.</li>
            <li>Xoá nội dung mặc định, dán toàn bộ file <code>Code.gs</code> đi kèm, bấm Lưu.</li>
            <li><b>Triển khai → Tạo tuỳ chọn triển khai mới</b> → loại <b>Ứng dụng web</b>.</li>
            <li>Thực thi với tư cách: <b>Tôi</b>; Ai có quyền truy cập: <b>Bất kỳ ai</b> → Triển khai, cấp quyền.</li>
            <li>Sao chép URL ứng dụng web (kết thúc bằng <code>/exec</code>) dán vào ô trên → <b>Kiểm tra kết nối</b> → <b>Lưu</b>.</li>
          </ol>
        </details>
      </div>
      <div class="px-6 py-4 border-t border-gray-200 flex justify-between gap-2">
        <button class="btn btn-ghost" onclick="A.testConnection()">Kiểm tra kết nối</button>
        <div class="flex gap-2"><button class="btn btn-ghost" onclick="A.closeModal()">Huỷ</button><button class="btn btn-primary" onclick="A.saveSettings()">${I.check} Lưu</button></div>
      </div>`, 'max-w-xl');
  },
  async testConnection(){
    const url = document.getElementById('st-url').value.trim(), st = document.getElementById('st-status');
    st.className = 'text-[13px] text-gray-500'; st.textContent = 'Đang kiểm tra...';
    if(!url){ st.className = 'text-[13px] text-red-600'; st.textContent = 'Chưa nhập URL.'; return; }
    try { const j = await apiFetch(url + (url.includes('?') ? '&' : '?') + 'ping=1&t=' + Date.now()); st.className = 'text-[13px] text-green-700'; st.textContent = '✓ Kết nối thành công' + (j.time ? ' (giờ máy chủ: ' + fmtDT(j.time) + ')' : '') + '.'; }
    catch(e){ st.className = 'text-[13px] text-red-600'; st.textContent = '✕ ' + e.message; }
  },
  async saveSettings(){
    const url = document.getElementById('st-url').value.trim();
    if(url && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(url) && !/^https?:\/\//.test(url)){ toast('URL không hợp lệ.', 'error'); return; }
    localStorage.setItem(API_KEY, url); // chuỗi rỗng = tắt đồng bộ, dùng dữ liệu cục bộ
    sync.error = null; A.closeModal();
    if(url){ try { await apiLoad(); toast('Đã bật đồng bộ Google Sheet.'); } catch(e){ toast('Lưu URL nhưng chưa kết nối được: ' + e.message, 'error'); } }
    else { DB = seedData(); save(); toast('Đã chuyển về chế độ dữ liệu cục bộ (dữ liệu mẫu).', 'info'); }
    localStorage.removeItem(SESSION_KEY); render();
  },
  resetData(){ if(!confirm('Đặt lại toàn bộ dữ liệu về dữ liệu mẫu? Mọi thay đổi của bạn sẽ bị xoá.')) return; DB = seedData(); save(); state.reportId = null; render(); toast('Đã đặt lại dữ liệu mẫu.', 'info'); },
  selectReport(id){ state.reportId = id; render(); },
  gotoReport(id){ const r = DB.reports.find(r => r.id === id); if(!r) return; state.view = 'checkin'; state.ckWeek = 'all'; state.ckUser = 'all'; state.reportId = id; render(); },
  openReportForm, openTaskForm,
  renderKrInputs(){
    const o = DB.okrs.find(o => o.id === document.getElementById('rf-okr').value);
    document.getElementById('rf-krs').innerHTML = o.krs.map(k => `
      <div class="flex items-center gap-3 px-3 py-2.5">
        <div class="flex-1 min-w-0"><div class="text-slate-800 font-medium truncate">${esc(k.title)}</div><div class="text-[12px] text-gray-500">Hiện tại: ${num(k.current)} / Mục tiêu: ${num(k.target)} ${esc(k.unit)}</div></div>
        <input type="number" min="0" step="any" class="input !w-32 kr-input text-right" data-kr="${k.id}" value="${k.current}">
        <span class="text-gray-500 text-[12.5px] w-16">${esc(k.unit)}</span>
      </div>`).join('');
  },
  addSolRow(){
    document.getElementById('rf-sols').insertAdjacentHTML('beforeend', `
      <div class="sol-row flex items-center gap-2 fade-in">
        <input class="input sol-text flex-1" placeholder="Hành động cụ thể cho tuần tới...">
        <input type="date" class="input sol-due !w-40" value="${toISO(addDays(weekStart(isoWeek(new Date()).week, isoWeek(new Date()).year), 11))}">
        <button class="text-gray-400 hover:text-red-600 p-1.5" onclick="this.closest('.sol-row').remove()">${I.x}</button>
      </div>`);
    const rows = document.querySelectorAll('.sol-text'); if(rows.length) rows[rows.length-1].focus();
  },
  submitReport(){
    const cw = isoWeek(new Date());
    const okrId = document.getElementById('rf-okr').value, work = document.getElementById('rf-work').value.trim();
    if(!work){ toast('Vui lòng nhập công việc đã thực hiện.', 'error'); return; }
    if(DB.reports.some(r => r.userId === me().id && r.okrId === okrId && r.week === cw.week && r.year === cw.year)){ toast('Bạn đã gửi báo cáo tuần này cho OKR này rồi.', 'error'); return; }
    const o = DB.okrs.find(o => o.id === okrId);
    const krUpdates = [...document.querySelectorAll('.kr-input')].map(i => ({ krId:i.dataset.kr, value:Number(i.value) || 0 }));
    const solutions = [...document.querySelectorAll('.sol-row')].map(row => ({ id:uid(), text:row.querySelector('.sol-text').value.trim(), due:row.querySelector('.sol-due').value })).filter(s => s.text);
    const now = new Date().toISOString();
    const r = { id:uid(), userId:me().id, week:cw.week, year:cw.year, okrId, createdAt:now, krUpdates, work, issues:document.getElementById('rf-issues').value.trim(), causes:document.getElementById('rf-causes').value.trim(), solutions, comments:[] };
    const tasks = solutions.map(s => ({ id:uid(), title:s.text, assigneeId:me().id, reportId:r.id, solutionId:s.id, okrId, week:cw.week, year:cw.year, due:s.due, status:'todo', createdAt:now }));
    A.closeModal(); state.view = 'checkin'; state.ckWeek = 'all'; state.reportId = r.id;
    mutate('addReport', { report:r, tasks }, () => {
      krUpdates.forEach(ku => { const k = o.krs.find(k => k.id === ku.krId); if(k) k.current = ku.value; });
      DB.reports.push(r); tasks.forEach(t => DB.tasks.push(t));
    }, `Đã gửi báo cáo${solutions.length ? ` và tạo ${solutions.length} công việc mới` : ''}.`);
  },
  deleteReport(id){
    if(!confirm('Xoá báo cáo này? Các công việc được tạo từ báo cáo cũng sẽ bị xoá.')) return;
    state.reportId = null;
    mutate('deleteReport', { id }, () => { DB.reports = DB.reports.filter(r => r.id !== id); DB.tasks = DB.tasks.filter(t => t.reportId !== id); }, 'Đã xoá báo cáo.');
  },
  addComment(rid){
    const ta = document.getElementById('cm-' + rid), text = ta.value.trim();
    if(!text){ toast('Vui lòng nhập nội dung phản hồi.', 'error'); return; }
    const c = { id:uid(), reportId:rid, authorId:me().id, text, createdAt:new Date().toISOString(), acknowledged:false };
    mutate('addComment', { comment:c }, () => { DB.reports.find(r => r.id === rid).comments.push(c); }, isMgr() ? 'Đã gửi phản hồi cho nhân viên.' : 'Đã gửi trả lời.');
  },
  ack(rid, cid){
    const ackAt = new Date().toISOString();
    mutate('ackComment', { id:cid, ackAt }, () => { const c = DB.reports.find(r => r.id === rid).comments.find(c => c.id === cid); c.acknowledged = true; c.ackAt = ackAt; }, 'Đã xác nhận: Đã đọc và hiểu chỉ đạo.');
  },
  toggleTask(id){ const t = DB.tasks.find(t => t.id === id); const s = t.status === 'done' ? 'todo' : 'done'; mutate('updateTask', { id, patch:{ status:s } }, () => { t.status = s; }); },
  setTaskStatus(id, s){ const t = DB.tasks.find(t => t.id === id); mutate('updateTask', { id, patch:{ status:s } }, () => { t.status = s; }); },
  deleteTask(id){ if(!confirm('Xoá công việc này?')) return; mutate('deleteTask', { id }, () => { DB.tasks = DB.tasks.filter(t => t.id !== id); }, 'Đã xoá công việc.'); },
  submitTask(){
    const title = document.getElementById('tf-title').value.trim();
    if(!title){ toast('Vui lòng nhập tên công việc.', 'error'); return; }
    const cw = isoWeek(new Date());
    const assigneeId = isMgr() ? document.getElementById('tf-user').value : me().id;
    const t = { id:uid(), title, assigneeId, reportId:null, solutionId:null, okrId:document.getElementById('tf-okr').value || null, week:cw.week, year:cw.year, due:document.getElementById('tf-due').value, status:'todo', createdAt:new Date().toISOString() };
    A.closeModal();
    mutate('addTask', { task:t }, () => { DB.tasks.push(t); }, 'Đã thêm công việc.');
  },
};

/* ---------- Khởi động ---------- */
// Gắn solutionId cho task mẫu (để liên kết checkbox trong chi tiết báo cáo)
function linkSeedTasks(){ let changed = false; DB.tasks.forEach(t => { if(t.reportId && !t.solutionId){ const r = DB.reports.find(r => r.id === t.reportId); const s = r && r.solutions.find(s => s.text === t.title); if(s){ t.solutionId = s.id; changed = true; } } }); if(changed) save(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') A.closeModal(); });
async function init(){
  load(); linkSeedTasks();
  if(online()){
    document.getElementById('app').innerHTML = `<div class="min-h-screen flex items-center justify-center text-gray-500 text-sm"><div class="flex items-center gap-3"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>Đang tải dữ liệu từ Google Sheet...</div></div>`;
    try { await apiLoad(); } catch(e){ toast('Không tải được từ Google Sheet, đang dùng dữ liệu đã lưu trên máy. ' + e.message, 'error'); }
  }
  render();
}
init();
</script>
</body>
</html>
