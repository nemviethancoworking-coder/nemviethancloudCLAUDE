  const y = t.getUTCFullYear();
  return { week: Math.ceil(((t - Date.UTC(y,0,1)) / 864e5 + 1) / 7), year: y };

/* Vai trò: director / head / manager / employee. Dữ liệu cũ chưa có Giám đốc → quản lý / trưởng phòng không có cấp trên được coi là Giám đốc. */
const ROLE_KEYS = ['director','head','manager','employee'];
const ROLE_RANK = { director:0, head:1, manager:2, employee:3 };
const PARENT_ROLE = { head:'director', manager:'head', employee:'manager' };      // cấp trên trực tiếp bắt buộc (khớp Code.gs)
function normalizeUsers(users){
  users.forEach(u => { u.role = String(u.role || '').trim().toLowerCase(); if(!ROLE_KEYS.includes(u.role)) u.role = 'employee'; u.managerId = u.managerId || ''; });
  if(!users.some(u => u.role === 'director')) users.forEach(u => { if((u.role === 'manager' || u.role === 'head') && !u.managerId) u.role = 'director'; });
}
/* Chuẩn hoá dữ liệu cũ (phiên bản 1 chỉ có 1 chu kỳ, KR không có baseline, OKR không có trạng thái, user chưa có quản lý) */
function normalize(db){
  if(!db || !Array.isArray(db.okrs)) return null;
  db.users = db.users || []; db.tasks = db.tasks || []; db.reports = db.reports || [];
  normalizeUsers(db.users);
  if(!db.cycles){ const c = db.cycle || { name:'Chu kỳ', start: toISO(new Date()), end: toISO(addDays(new Date(), 90)) }; db.cycles = [{ id:'c1', name:c.name, start:c.start, end:c.end, active:true }]; delete db.cycle; }
  if(!db.cycles.some(c => c.active) && db.cycles.length) db.cycles[0].active = true;
  const cid = (db.cycles.find(c => c.active) || db.cycles[0] || {}).id;
  db.okrs.forEach(o => { o.cycleId = o.cycleId || cid; o.status = o.status || 'approved'; o.createdBy = o.createdBy || o.ownerId; o.reviewNote = o.reviewNote || ''; o.updatedAt = o.updatedAt || ''; (o.krs || []).forEach(k => { k.baseline = Number(k.baseline) || 0; k.current = Number(k.current) || 0; k.target = Number(k.target) || 0; }); });
  return db;
}

const DEFAULT_API = 'https://ttpemqkjp.tino.page/okr-api/';

function setBusy(b){ sync.busy = b; const el = document.getElementById('sync-dot'); if(el) el.className = syncDotClass(); }
const syncDotClass = () => 'w-2 h-2 rounded-full shrink-0 ' + (!online() ? 'bg-gray-400' : sync.error ? 'bg-red-500' : sync.busy ? 'bg-amber-400 animate-pulse' : 'bg-green-500');
async function apiFetch(url, opts){
  const res = await fetch(url, opts);
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch(e){ throw new Error('Không kết nối được máy chủ dữ liệu, vui lòng thử lại.'); }
  if(!j.ok){ const err = new Error(j.error || 'Lỗi máy chủ'); err.auth = !!j.auth; throw err; }
  return j;
}
async function apiLoad(){
  if(!online()) return;
  setBusy(true);
  try {
    const u = apiUrl(), tk = token();
    const v = sync.version && DB ? '&v=' + encodeURIComponent(sync.version) : '';
    const j = await apiFetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now() + (tk ? '&token=' + encodeURIComponent(tk) : '') + v);
    if(!j.unchanged){ DB = normalize(j.db); save(); sync.version = j.version || null; }      // không có gì mới → giữ nguyên
    sync.error = null; sync.lastAt = new Date();
  }
  catch(e){ sync.error = e.auth ? null : e.message; throw e; }
  finally { setBusy(false); }
}
async function api(action, payload){
  // POST không đặt Content-Type để tránh preflight CORS; Apps Script vẫn đọc được body.
  // Thao tác ghi dùng chế độ gọn (lite): máy chủ chỉ trả "ok", app đã tự cập nhật tại chỗ rồi tải lại dữ liệu mới sau ít giây.
  const j = await apiFetch(apiUrl(), { method:'POST', body: JSON.stringify({ action, payload, token: token(), lite: action !== 'login' }) });
  if(j.db){ DB = normalize(j.db); save(); sync.version = j.version || null; }
  else scheduleRefresh();
  sync.error = null; sync.lastAt = new Date();
  return j;
}
let refreshTimer = null;
function scheduleRefresh(){ clearTimeout(refreshTimer); refreshTimer = setTimeout(() => { if(!sync.busy) refreshFromServer(true); else scheduleRefresh(); }, 1500);
}
/* Token hết hạn / không hợp lệ → đăng xuất, yêu cầu đăng nhập lại. */
function forceLogout(msg){
  localStorage.removeItem(SESSION_KEY); sync.version = null;
  if(online() && DB){ DB.tasks = []; save(); }
  document.getElementById('modal').innerHTML = '';
  render(); toast(msg || 'Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.', 'error');
  apiLoad().then(() => { if(!session()) render(); }).catch(() => {});   // tải lại danh sách tài khoản mới nhất cho màn đăng nhập
}
/* Áp dụng thay đổi ngay tại máy (localFn), rồi đẩy lên Sheet nếu đang bật đồng bộ. */
async function mutate(action, payload, localFn, successMsg){
  localFn(); save(); render();
  if(successMsg) toast(successMsg);
  if(!online()) return;
  setBusy(true);
  try { await api(action, payload); render(); }
  catch(e){
    if(e.auth){ setBusy(false); forceLogout(e.message); return; }
    sync.error = e.message; toast('Không lưu được dữ liệu: ' + e.message, 'error'); try { await apiLoad(); } catch(_){} render();
  }
  finally { setBusy(false); }
}
async function refreshFromServer(silent){

}

const user = id => findUser(id) || { id, name:'?', color:'#999', dept:'', role:'employee', managerId:'' };
const ROLES = {
  director:{ t:'Giám đốc', c:'bg-slate-800 text-white border-slate-800' },
  head:    { t:'Trưởng phòng', c:'bg-indigo-600 text-white border-indigo-600' },

};

const isDir = () => !!me() && me().role === 'director';
const isMgr = () => !!me() && me().role !== 'employee';           // Giám đốc, Trưởng phòng hoặc Quản lý (có cấp dưới)
/* viewer quản lý được targetId: Giám đốc → tất cả; Trưởng phòng / Quản lý → toàn bộ cấp dưới trực tiếp và gián tiếp. Khớp với Code.gs. */
function canManage(targetId, viewer){
  viewer = viewer || me(); if(!viewer) return false;
  if(viewer.role === 'director') return true;
  if(viewer.role !== 'head' && viewer.role !== 'manager') return false;
  const key = viewer.id + '>' + targetId;
  if(IX && IX.cm.has(key)) return IX.cm.get(key);
  let t = findUser(targetId), ok = false; const seen = new Set();
  if(t && t.id !== viewer.id){
    while(t && t.managerId && !seen.has(t.id)){
      if(t.managerId === viewer.id){ ok = true; break; }
      seen.add(t.id); t = findUser(t.managerId);
    }
  }
  if(IX) IX.cm.set(key, ok);
  return ok;
}
/* Phản hồi là "chỉ đạo" (cần xác nhận) khi người viết là cấp trên (trực tiếp/gián tiếp) của chủ báo cáo hoặc Giám đốc. */

/* ---------- Tính toán OKR ---------- */
/* Tiến độ KR tính từ giá trị đầu kỳ (baseline) → mục tiêu; hỗ trợ cả KR giảm (mục tiêu < đầu kỳ) */
function krPctOf(k, current){
  const b = Number(k.baseline) || 0, t = Number(k.target) || 0, c = Number(current) || 0;
  if(t === b) return c === t ? 100 : (t > 0 && c >= t) || (t <= 0 && c <= t) ? 100 : 0;
  return Math.max(0, Math.min(100, Math.round((c - b) / (t - b) * 100)));
}
const krPct = k => krPctOf(k, k.current);
const okrPct = o => o.krs.length ? Math.round(o.krs.reduce((a,k) => a + krPct(k), 0) / o.krs.length) : 0;
const OKR_STATUS = { pending:{ t:'Chờ duyệt', c:'bg-amber-50 text-amber-700 border-amber-200' }, approved:{ t:'Đã duyệt', c:'bg-green-50 text-green-700 border-green-200' }, rejected:{ t:'Từ chối', c:'bg-red-50 text-red-700 border-red-200' } };
const UNITS = ['%','VNĐ','triệu','tỷ','đơn','lead','khách','bài','video','follower','lần','ngày','giờ','người','sản phẩm','điểm'];

function cycleInfo(c){
  c = c || curCycle();
  if(!c) return { expected:0, daysLeft:0, status:'—' };
  const s = fromISO(c.start), e = addDays(fromISO(c.end), 1), n = new Date();
  const total = Math.max((e - s) / 864e5, 1); const el = Math.min(Math.max((n - s) / 864e5, 0), total);
  return { expected: Math.round(el / total * 100), daysLeft: Math.max(0, Math.ceil((e - n) / 864e5)), status: n < s ? 'Sắp bắt đầu' : n >= e ? 'Đã kết thúc' : 'Đang diễn ra' };
}
function okrStatus(pct, c){

  if(pct >= ex - 10) return { t:'Đúng tiến độ', c:'bg-green-50 text-green-700 border-green-200', bar:'bg-green-500' };
  if(pct >= ex - 25) return { t:'Cần chú ý', c:'bg-amber-50 text-amber-700 border-amber-200', bar:'bg-amber-500' };

}

/* ---------- Toast & Modal ---------- */
function toast(msg, type='success'){
  const el = document.createElement('div');
  const color = type === 'error' ? 'bg-red-600' : type === 'info' ? 'bg-slate-800' : 'bg-emerald-600';
  el.className = `fade-in ${color} text-white text-sm px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-2`;
  el.innerHTML = `${type === 'error' ? I.x : I.check} <span>${esc(msg)}</span>`;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2800);
}

}

/* ---------- Tổng quan OKRs ---------- */
function viewDashboard(){
  const cw = isoWeek(new Date());
  const cyc = curCycle(), ci = cycleInfo(cyc);
  const AO = approvedOkrs(), pendingN = okrsOfCycle(cyc.id, 'pending').length;
  const people = DB.users.filter(u => (u.role !== 'director' && isActive(u)) || AO.some(o => o.ownerId === u.id));
  const avg = AO.length ? Math.round(AO.reduce((a,o) => a + okrPct(o), 0) / AO.length) : 0;
  const reporters = people.filter(u => AO.some(o => o.ownerId === u.id));
  const submitted = new Set(DB.reports.filter(r => r.week === cw.week && r.year === cw.year && reporters.some(u => u.id === r.userId)).map(r => r.userId)).size;
  const overdue = visibleTasks().filter(isOverdue).length;
  const stat = (label, value, sub, color='text-slate-900') => `<div class="card p-4"><div class="text-[12.5px] text-gray-500">${label}</div><div class="text-2xl font-semibold mt-1 ${color}">${value}</div><div class="text-[12px] text-gray-500 mt-0.5">${sub}</div></div>`;
  const id = session();
  const rank = u => u.id === id ? 0 : canManage(u.id) && !isDir() ? 1 : 2;
  const ordered = [...people].sort((a,b) => rank(a) - rank(b));
  const list = ordered.filter(u => matchUser(u.id, state.dashUser));

  return `
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
    ${stat('Mục tiêu đã duyệt', AO.length, `${AO.reduce((a,o) => a + o.krs.length, 0)} kết quả then chốt${pendingN ? ` · <span class="text-amber-600">${pendingN} chờ duyệt</span>` : ''}`)}
    ${stat('Tiến độ trung bình', avg + '%', `Kỳ vọng theo thời gian: ${ci.expected}%`, avg >= ci.expected - 10 ? 'text-green-600' : 'text-amber-600')}
    ${stat('Báo cáo tuần này', `${submitted}/${reporters.length}`, 'người có OKR đã gửi check-in', submitted === reporters.length ? 'text-green-600' : 'text-slate-900')}
    ${stat('Công việc quá hạn', overdue, isDir() ? 'toàn công ty' : isMgr() ? 'của bạn & cấp dưới' : 'của bạn', overdue ? 'text-red-600' : 'text-green-600')}
  </div>
  <div class="flex items-center gap-2 mb-4 flex-wrap">
    <span class="chip ${state.dashUser === 'all' ? 'active' : ''}" onclick="A.set('dashUser','all')">Cả đội</span>
    ${isMgr() && !isDir() ? `<span class="chip ${state.dashUser === 'team' ? 'active' : ''}" onclick="A.set('dashUser','team')">Cấp dưới của tôi</span>` : ''}
    ${people.map(u => `<span class="chip ${state.dashUser === u.id ? 'active' : ''}" onclick="A.set('dashUser','${u.id}')">${esc(u.name)}</span>`).join('')}
  </div>
  <div class="space-y-5">
    ${list.map(u => {
      const okrs = AO.filter(o => o.ownerId === u.id);
      const upct = okrs.length ? Math.round(okrs.reduce((a,o) => a + okrPct(o), 0) / okrs.length) : 0;
      const last = DB.reports.filter(r => r.userId === u.id).sort((a,b) => (b.year - a.year) || (b.week - a.week))[0];
      const m = u.managerId ? user(u.managerId) : null;
      return `
      <div class="card">
        <div class="flex items-center gap-3 px-5 py-3.5 border-b border-gray-100">
          ${avatar(u)}
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2"><span class="font-semibold text-slate-900">${esc(u.name)}</span>${u.id === id ? badge('Bạn', 'bg-base-50 text-base-700 border-base-100') : ''}${u.role !== 'employee' ? roleBadge(u) : ''}</div>
            <div class="text-[12px] text-gray-500">${esc(u.title)} · ${esc(u.dept)}${m ? ` · QL: ${esc(m.name)}` : ''} · ${okrs.length} mục tiêu${last ? ` · Check-in gần nhất: ${weekLabel(last.week, last.year, true)}` : ' · Chưa có check-in'}</div>
          </div>
          <div class="w-48 hidden sm:block">
            <div class="flex justify-between text-[12px] mb-1"><span class="text-gray-500">Tiến độ chung</span><span class="font-semibold">${upct}%</span></div>
            ${progressBar(upct, okrStatus(upct).bar)}
          </div>
        </div>
        <div class="p-4 grid md:grid-cols-2 gap-4">
          ${okrs.length ? okrs.map(o => okrCard(o, cyc)).join('') : `<div class="text-gray-400 text-[13px] italic col-span-2">Chưa có mục tiêu đã duyệt trong chu kỳ này.${(u.id === id || canManage(u.id)) ? ` <a class="text-base-600 not-italic hover:underline cursor-pointer" onclick="A.openOkrForm(null,'${u.id}')">Tạo OKR</a>` : ''}</div>`}
        </div>
      </div>`;
    }).join('') || '<div class="card p-10 text-center text-gray-400">Không có ai trong bộ lọc này.</div>'}
  </div>`;
}

/* ---------- Thẻ OKR dùng chung ---------- */
function okrCard(o, cyc, opts={}){
  const p = okrPct(o), st = okrStatus(p, cyc);
  const approved = o.status === 'approved';
  return `
  <div class="border ${approved ? 'border-gray-200' : 'border-dashed border-amber-300 bg-amber-50/30'} rounded-lg p-4" data-okr="${o.id}">
    <div class="flex items-start justify-between gap-3">
      <div class="flex items-start gap-2 min-w-0"><span class="text-base-600 mt-0.5 shrink-0">${I.flag}</span><div class="font-semibold text-slate-900 leading-snug">${esc(o.title)}</div></div>

/* Các KR của OKR mà người dùng đã báo cáo trong tuần này (báo cáo cũ theo nguyên bộ tính là đã báo cáo mọi KR) */
function sentKrIds(okrId){
  const cw = isoWeek(new Date()), set = new Set();
  DB.reports.forEach(r => { if(r.userId === session() && r.okrId === okrId && r.week === cw.week && r.year === cw.year) r.krUpdates.forEach(ku => set.add(ku.krId)); });
  return set;
}
function openReportForm(){

  if(!okrs.length){ toast('Bạn chưa có OKR nào được duyệt trong chu kỳ hiện tại. Hãy tạo OKR ở mục Quản lý OKR.', 'error'); return; }
  openModal(`

/* ---------- Quản lý công việc (lọc theo quyền) ---------- */
function viewTasks(){
  const scope = scopeUsers();
  let ts = visibleTasks();
  if(state.taskUser !== 'all' && !scope.some(u => u.id === state.taskUser)) state.taskUser = 'all';
  if(state.taskUser !== 'all') ts = ts.filter(t => t.assigneeId === state.taskUser);
  const counts = { all: ts.length, todo: ts.filter(t => t.status === 'todo').length, doing: ts.filter(t => t.status === 'doing').length, done: ts.filter(t => t.status === 'done').length, overdue: ts.filter(isOverdue).length };
  if(state.taskStatus !== 'all') ts = state.taskStatus === 'overdue' ? ts.filter(isOverdue) : ts.filter(t => t.status === state.taskStatus);
  const order = { todo:0, doing:1, done:2 };
  ts = [...ts].sort((a,b) => (order[a.status] - order[b.status]) || (a.due || '9').localeCompare(b.due || '9'));
  const tab = (key, label, cnt, cls='') => `<span class="chip ${state.taskStatus === key ? 'active' : ''} ${cls}" onclick="A.set('taskStatus','${key}')">${label} <span class="opacity-70">${cnt}</span></span>`;
  const stat = (label, value, color='text-slate-900') => `<div class="card p-4"><div class="text-[12.5px] text-gray-500">${label}</div><div class="text-2xl font-semibold mt-1 ${color}">${value}</div></div>`;
  const staffN = scope.length - 1;
  const scopeNote = isDir() ? 'Bạn là Giám đốc: xem được công việc của toàn bộ nhân sự.'
    : isMgr() ? `Bạn xem được công việc của mình và <b>${staffN}</b> người cấp dưới${me().role === 'head' ? ' trong phòng' : ''}${staffN ? ` (${scope.slice(1).map(u => esc(u.name)).join(', ')})` : ''}.`
    : 'Bạn chỉ xem được công việc của chính mình.';
  return `
  <div class="card px-4 py-2.5 mb-4 text-[13px] text-slate-600 flex items-center gap-2" id="task-scope">${I.lock}<span>${scopeNote}</span></div>
  <div class="grid grid-cols-2 lg:grid-cols-5 gap-4 mb-5">
    ${stat('Tổng công việc', counts.all)}${stat('Cần làm', counts.todo)}${stat('Đang làm', counts.doing, 'text-blue-600')}${stat('Hoàn thành', counts.done, 'text-green-600')}${stat('Quá hạn', counts.overdue, counts.overdue ? 'text-red-600' : 'text-green-600')}
  </div>
  <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">
    <div class="flex items-center gap-2 flex-wrap">
      ${tab('all','Tất cả',counts.all)}${tab('todo','Cần làm',counts.todo)}${tab('doing','Đang làm',counts.doing)}${tab('done','Hoàn thành',counts.done)}${tab('overdue','Quá hạn',counts.overdue)}
      ${isMgr() ? `<select class="input !w-auto ml-2" onchange="A.set('taskUser',this.value)"><option value="all">${isDir() ? 'Tất cả nhân sự' : 'Tôi & cấp dưới'}</option>${scope.map(u => `<option value="${u.id}" ${state.taskUser === u.id ? 'selected' : ''}>${esc(u.name)}${u.id === session() ? ' (tôi)' : ''}</option>`).join('')}</select>` : ''}
    </div>
    <button class="btn btn-primary" onclick="A.openTaskForm()">${I.plus} Thêm công việc</button>
  </div>
  <div class="card overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-50 text-gray-500 text-[12px] uppercase tracking-wide">
        <tr><th class="w-10 py-2.5"></th><th class="text-left font-medium py-2.5 px-2">Công việc</th>${isMgr() ? '<th class="text-left font-medium py-2.5 px-2">Người làm</th>' : ''}<th class="text-left font-medium py-2.5 px-2">Nguồn</th><th class="text-left font-medium py-2.5 px-2">Hạn</th><th class="text-left font-medium py-2.5 px-2 w-36">Trạng thái</th><th class="w-12"></th></tr>
      </thead>
      <tbody class="divide-y divide-gray-100" id="task-rows">
        ${ts.length ? ts.slice(0, state.taskLimit).map(t => { const u = user(t.assigneeId), o = okrById(t.okrId), od = isOverdue(t); return `
        <tr class="hover:bg-gray-50 ${t.status === 'done' ? 'opacity-70' : ''}" data-task="${t.id}" data-assignee="${t.assigneeId}">
          <td class="text-center py-3"><input type="checkbox" class="checkbox align-middle" ${t.status === 'done' ? 'checked' : ''} onchange="A.toggleTask('${t.id}')"></td>
          <td class="py-3 px-2"><div class="font-medium ${t.status === 'done' ? 'line-through text-gray-400' : 'text-slate-900'}">${esc(t.title)}</div>${o ? `<div class="text-[12px] text-gray-500 mt-0.5 flex items-center gap-1">${I.flag} ${esc(o.title)}</div>` : ''}</td>
          ${isMgr() ? `<td class="py-3 px-2"><div class="flex items-center gap-2">${avatar(u, 'w-6 h-6 text-[10px]')}<span class="text-slate-700 whitespace-nowrap">${esc(u.name)}</span></div></td>` : ''}
          <td class="py-3 px-2 text-[12.5px] text-gray-500 whitespace-nowrap">${t.reportId ? `<a class="text-base-600 hover:underline cursor-pointer" onclick="A.gotoReport('${t.reportId}')">Báo cáo ${weekLabel(t.week, t.year, true)}</a>` : 'Thêm thủ công'}</td>
          <td class="py-3 px-2 text-[12.5px] whitespace-nowrap ${od ? 'text-red-600 font-medium' : 'text-slate-700'}">${t.due ? fmt(t.due) : '—'}${od ? ' · Quá hạn' : ''}</td>
          <td class="py-3 px-2"><select class="input !py-1 !px-2 text-[12.5px]" onchange="A.setTaskStatus('${t.id}',this.value)">${Object.entries(TASK_STATUS).map(([k,v]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${v.t}</option>`).join('')}</select></td>
          <td class="py-3 text-center"><button class="text-gray-400 hover:text-red-600 p-1" title="Xoá" onclick="A.deleteTask('${t.id}')">${I.trash}</button></td>
        </tr>`; }).join('') + (ts.length > state.taskLimit ? `<tr><td colspan="7" class="p-3 text-center"><button class="btn btn-ghost btn-sm" id="more-tasks" onclick="A.more('taskLimit')">Xem thêm ${Math.min(PAGE.taskLimit, ts.length - state.taskLimit)} công việc (còn ${ts.length - state.taskLimit})</button></td></tr>` : '') : `<tr><td colspan="7" class="p-10 text-center text-gray-400">Không có công việc nào.</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

/* ---------- Nhân sự & phân quyền (chỉ Giám đốc) ---------- */
function orgNode(u, depth, seen){
  if(seen.has(u.id)) return ''; seen.add(u.id);
  const kids = staffOf(u.id).sort((a,b) => (ROLE_RANK[a.role] - ROLE_RANK[b.role]) || a.name.localeCompare(b.name));
  const bad = u.managerId && PARENT_ROLE[u.role] && user(u.managerId).role !== PARENT_ROLE[u.role];
  return `
  <div class="${depth ? 'ml-6 pl-4 border-l-2 border-gray-200' : ''}">
    <div class="flex items-center gap-2.5 py-1.5 ${isActive(u) ? '' : 'opacity-60'}" data-node="${u.id}">
      ${avatar(u, 'w-7 h-7 text-[10px]')}
      <span class="font-medium text-slate-900">${esc(u.name)}</span>${roleBadge(u)}${isActive(u) ? '' : LOCKED_BADGE}
      <span class="text-[12px] text-gray-500 truncate">${esc(u.title || u.dept)}</span>
      ${kids.length ? `<span class="text-[11.5px] text-gray-400">· ${kids.length} trực thuộc</span>` : ''}
      ${bad ? `<span class="text-[11.5px] text-amber-700">· cấp trên chưa đúng cấp</span>` : ''}
      <button class="ml-auto text-gray-400 hover:text-slate-700 p-1" title="Sửa" onclick="A.openUserForm('${u.id}')">${I.edit}</button>
    </div>
    ${kids.map(k => orgNode(k, depth + 1, seen)).join('')}
  </div>`;
}
function viewPeople(){
  const seen = new Set();
  const roots = DB.users.filter(u => u.role === 'director');
  const tree = roots.map(r => orgNode(r, 0, seen)).join('');
  const orphans = DB.users.filter(u => !seen.has(u.id));
  const rows = [...DB.users].sort((a,b) => (isActive(b) - isActive(a)) || (ROLE_RANK[a.role] - ROLE_RANK[b.role]) || a.name.localeCompare(b.name));
  const nLocked = DB.users.filter(u => !isActive(u)).length;
  const counts = ROLE_KEYS.map(k => `${ROLES[k].t}: <b>${DB.users.filter(u => u.role === k && isActive(u)).length}</b>`).join(' · ') + (nLocked ? ` · Đã khoá: <b>${nLocked}</b>` : '');

  <div class="flex items-center justify-between gap-3 mb-4 flex-wrap">

    <button class="btn btn-primary" onclick="A.openUserForm()">${I.plus} Thêm nhân sự</button>
  </div>
  <div class="card p-5 mb-5" id="org-tree">

    ${tree || '<div class="text-gray-400 italic">Chưa có Giám đốc.</div>'}
    ${orphans.length ? `
    <div class="mt-4 rounded-lg border border-amber-200 bg-amber-50 p-3" id="org-orphans">
      <div class="text-[13px] text-amber-800 mb-1">${orphans.length} người chưa gắn vào sơ đồ (chưa có cấp trên) — chỉ Giám đốc xem được công việc của họ:</div>
      ${missingLevels().map(m => `<div class="text-[12.5px] text-amber-800 mb-1" data-missing="${m.parent}">• Có ${m.n} ${ROLES[m.role].t} nhưng chưa có <b>${ROLES[m.parent].t}</b> nào để gán. <button class="underline font-semibold" onclick="A.openUserForm('', '${m.parent}')">Tạo ${ROLES[m.parent].t}</button> trước, rồi sửa từng người để gán cấp trên.</div>`).join('')}
      ${orphans.map(o => orgNode(o, 0, seen)).join('')}
    </div>` : ''}
  </div>
  <div class="card overflow-hidden">
    <table class="w-full">
      <thead class="bg-gray-50 text-gray-500 text-[12px] uppercase tracking-wide">
        <tr><th class="text-left font-medium py-2.5 px-4">Nhân sự</th><th class="text-left font-medium py-2.5 px-2">Vai trò</th><th class="text-left font-medium py-2.5 px-2">Cấp trên trực tiếp</th><th class="text-left font-medium py-2.5 px-2">Tên đăng nhập</th><th class="w-32"></th></tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        ${rows.map(u => { const m = u.managerId ? user(u.managerId) : null; return `
        <tr class="hover:bg-gray-50 ${isActive(u) ? '' : 'bg-gray-50/60 text-gray-500'}" data-user="${u.id}">
          <td class="py-2.5 px-4"><div class="flex items-center gap-2.5 ${isActive(u) ? '' : 'opacity-60'}">${avatar(u, 'w-7 h-7 text-[10px]')}<div><div class="font-medium text-slate-900">${esc(u.name)}${u.id === session() ? ' <span class="text-gray-400 font-normal">(bạn)</span>' : ''}${isActive(u) ? '' : ' ' + LOCKED_BADGE}</div><div class="text-[12px] text-gray-500">${esc(u.title)}${u.title && u.dept ? ' · ' : ''}${esc(u.dept)}</div></div></div></td>
          <td class="py-2.5 px-2">${roleBadge(u)}</td>
          <td class="py-2.5 px-2">${m ? `<div class="flex items-center gap-2">${avatar(m, 'w-6 h-6 text-[9px]')}<span class="text-slate-700">${esc(m.name)}</span></div>` : `<span class="text-gray-400">${u.role === 'director' ? '—' : 'Chưa gán'}</span>`}</td>
          <td class="py-2.5 px-2"><code class="text-[12px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded">${esc(u.username)}</code></td>
          <td class="py-2.5 pr-3"><div class="flex items-center justify-end gap-1">
            <button class="btn btn-ghost btn-sm" title="Sửa" onclick="A.openUserForm('${u.id}')">${I.edit}</button>
            ${u.id === session() ? '' : isActive(u)
              ? `<button class="btn btn-ghost btn-sm" data-act="lock" title="Khoá tài khoản (nghỉ việc): không đăng nhập được, giữ nguyên dữ liệu" onclick="A.setUserActive('${u.id}', false)">${I.lock}</button>`
              : `<button class="btn btn-ghost btn-sm text-emerald-700" data-act="unlock" title="Mở khoá tài khoản" onclick="A.setUserActive('${u.id}', true)">${I.unlock}</button>`}
            ${u.id === session() ? '' : `<button class="btn btn-ghost btn-sm text-red-600" data-act="delete" title="Xoá hẳn (chỉ khi chưa có dữ liệu)" onclick="A.deleteUser('${u.id}')">${I.trash}</button>`}
          </div></td>
        </tr>`; }).join('')}
      </tbody>
    </table>
  </div>`;
}
/* Vai trò đang có người nhưng cấp ngay trên chưa có ai (vd. có Quản lý mà chưa có Trưởng phòng). */
function missingLevels(){
  return ['head', 'manager', 'employee'].map(role => ({ role, parent:PARENT_ROLE[role], n:DB.users.filter(u => u.role === role && isActive(u)).length }))
    .filter(m => m.n && !DB.users.some(u => u.role === m.parent && isActive(u)));
}
/* Danh sách cấp trên hợp lệ theo vai trò: NV → Quản lý, Quản lý → Trưởng phòng, Trưởng phòng → Giám đốc. */
function parentOptions(role, selfId, selected){
  const pr = PARENT_ROLE[role];
  if(!pr) return '<option value="">— Không có (Giám đốc là cấp cao nhất) —</option>';
  const list = DB.users.filter(x => x.role === pr && x.id !== selfId && (isActive(x) || x.id === selected));
  return `<option value="">— Chưa gán —</option>` + list.map(l => `<option value="${l.id}" ${selected === l.id ? 'selected' : ''}>${esc(l.name)} · ${esc(l.dept || ROLES[l.role].t)}${lockedTag(l)}</option>`).join('');
}
/* Gợi ý khi chưa có ai ở cấp ngay trên (vd. chưa có Trưởng phòng nên chưa gán được Quản lý). */
function parentHint(role, selfId){
  const pr = PARENT_ROLE[role];
  if(!pr || DB.users.some(x => x.role === pr && x.id !== selfId && isActive(x))) return '';
  return `<div class="mt-1.5 text-[12px] text-amber-700 bg-amber-50 border border-amber-200 rounded-md px-2.5 py-1.5" id="uf-manager-hint">
    Chưa có <b>${ROLES[pr].t}</b> nào nên chưa gán được. ${ROLES[role].t} phải trực thuộc một ${ROLES[pr].t}.
    <button type="button" class="underline font-semibold ml-1" onclick="A.openUserForm('', '${pr}')">Tạo ${ROLES[pr].t} ngay</button>
    <div class="text-amber-600 mt-0.5">Có thể lưu tạm "Chưa gán" rồi gán lại sau.</div>
  </div>`;
}

    <div class="p-6 space-y-4">

        <div><label class="label">Tên đăng nhập <span class="text-red-500">*</span></label><input id="uf-username" class="input" value="${esc(u ? u.username : '')}" placeholder="vana" autocomplete="off"></div>

        <div><label class="label" id="uf-manager-label">Cấp trên trực tiếp${PARENT_ROLE[role] ? ` (${ROLES[PARENT_ROLE[role]].t})` : ''}</label><select id="uf-manager" class="input">${parentOptions(role, id, u ? u.managerId : '')}</select><div id="uf-manager-hint-box">${parentHint(role, id)}</div></div>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="label">Phòng ban</label><input id="uf-dept" class="input" value="${esc(u ? u.dept : '')}"></div>

      <div><label class="label">Mật khẩu ${u ? '' : '<span class="text-red-500">*</span>'}</label><input id="uf-password" class="input" type="text" autocomplete="new-password" placeholder="${u ? 'Để trống để giữ mật khẩu hiện tại' : 'Mật khẩu đăng nhập'}"></div>

}

/* ---------- Đổi mật khẩu (mỗi người tự đổi) ---------- */

  openModal(`
    ${modalHeader('Đổi mật khẩu', 'Mật khẩu mới có hiệu lực từ lần đăng nhập sau.')}
    <form class="p-6 space-y-4" onsubmit="event.preventDefault();A.changePassword()">
      <input type="text" class="hidden" autocomplete="username" value="${esc(me().username)}">
      <div><label class="label">Mật khẩu hiện tại</label><input id="pw-old" type="password" class="input" autocomplete="current-password"></div>
      <div><label class="label">Mật khẩu mới <span class="text-gray-400 font-normal">(ít nhất 6 ký tự)</span></label><input id="pw-new" type="password" class="input" autocomplete="new-password"></div>
      <div><label class="label">Nhập lại mật khẩu mới</label><input id="pw-new2" type="password" class="input" autocomplete="new-password"></div>
      <div id="pw-err" class="text-red-600 text-[13px] hidden"></div>

        <button type="button" class="btn btn-ghost" onclick="A.cancelModal()">Huỷ</button>

}

/* ---------- Hành động ---------- */
const A = {
  nav(v){ state.view = v; state.reportLimit = PAGE.reportLimit; state.taskLimit = PAGE.taskLimit; render(); },
  set(k, v){ state[k] = v; if(k === 'ckWeek' || k === 'ckUser') state.reportId = null; if(k !== 'reportLimit' && k !== 'taskLimit'){ state.reportLimit = PAGE.reportLimit; state.taskLimit = PAGE.taskLimit; } render(); },
  more(k){ state[k] += PAGE[k]; render(); },
  closeModal(){ document.getElementById('modal').innerHTML = ''; modalDirty = false; },
  cancelModal(){   // đóng do người dùng bấm X / Huỷ / Esc → hỏi lại nếu đang nhập dở
    if(!document.getElementById('modal').innerHTML.trim()) return;
    if(modalDirty && !confirm('Bạn có chắc muốn đóng? Nội dung đang nhập chưa được lưu sẽ bị mất.')) return;
    A.closeModal();
  },
  fillLogin(un){ const u = DB.users.find(u => u.username === un); document.getElementById('lg-user').value = un; document.getElementById('lg-pass').value = (u && u.password) || ''; document.getElementById('lg-pass').focus(); },
  async login(){
    const un = document.getElementById('lg-user').value.trim(), pw = document.getElementById('lg-pass').value;
    const err = document.getElementById('lg-err'), btn = document.getElementById('lg-btn');
    const fail = m => { err.textContent = m; err.classList.remove('hidden'); };
    let u, tk = '';
    if(online()){
      btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
      try { const j = await api('login', { username:un, password:pw }); u = j.user; tk = j.token || ''; }
      catch(e){ btn.disabled = false; btn.textContent = 'Đăng nhập'; return fail(e.message); }
      if(!tk){ btn.disabled = false; btn.textContent = 'Đăng nhập'; return fail('Máy chủ chưa cập nhật Code.gs mới (phân quyền). Hãy triển khai lại Apps Script.'); }
    } else {
      u = DB.users.find(u => u.username === un && u.password === pw);
      if(!u) return fail('Sai tên đăng nhập hoặc mật khẩu.');
      if(!isActive(u)) return fail('Tài khoản này đã bị khoá. Liên hệ Giám đốc nếu cần mở lại.');
    }
    setSession(u.id, tk); state = { ...state, view:'dashboard', reportId:null, dashUser:'all', ckUser:'all', ckWeek:'all', taskStatus:'all', taskUser:'all', okrUser:'all', okrStatus:'all' };
    render(); toast(`Xin chào, ${u.name}!`, 'info');
  },
  logout(){ localStorage.removeItem(SESSION_KEY); sync.version = null; if(online()){ DB.tasks = []; save(); } render(); },
  refresh(){ refreshFromServer(false); },
  selectReport(id){ state.reportId = id; render(); },
  gotoReport(id){ const r = DB.reports.find(r => r.id === id); if(!r) return; state.view = 'checkin'; state.ckWeek = 'all'; state.ckUser = 'all'; state.reportId = id; render(); },
  openReportForm, openTaskForm, openOkrForm, openReview, openCycles, openUserForm, openPasswordForm,
  async changePassword(){
    const old = document.getElementById('pw-old').value, n1 = document.getElementById('pw-new').value, n2 = document.getElementById('pw-new2').value;
    const err = document.getElementById('pw-err'), btn = document.getElementById('pw-submit');
    const fail = m => { err.textContent = m; err.classList.remove('hidden'); };
    if(!old) return fail('Nhập mật khẩu hiện tại.');
    if(n1.length < 6) return fail('Mật khẩu mới cần ít nhất 6 ký tự.');
    if(n1 !== n2) return fail('Hai lần nhập mật khẩu mới không khớp.');
    if(n1 === old) return fail('Mật khẩu mới phải khác mật khẩu hiện tại.');
    if(!online()){
      const u = me(); if(u.password !== old) return fail('Mật khẩu hiện tại không đúng.');
      u.password = n1; save(); A.closeModal(); toast('Đã đổi mật khẩu.'); return;
    }
    btn.disabled = true;
    try { await api('changePassword', { oldPassword:old, newPassword:n1 }); A.closeModal(); toast('Đã đổi mật khẩu. Lần sau đăng nhập bằng mật khẩu mới.'); }
    catch(e){ btn.disabled = false; if(e.auth){ A.closeModal(); forceLogout(e.message); return; } fail(e.message); }
  },
  setUserActive(id, active){
    if(!isDir()) return;
    const u = DB.users.find(x => x.id === id); if(!u || id === session()) return;
    if(!active){
      const subs = staffOf(id).filter(isActive);
      if(subs.length){ toast(`${u.name} còn ${subs.length} người trực thuộc. Hãy chuyển họ sang cấp trên khác trước khi khoá.`, 'error'); return; }
      if(!confirm(`Khoá tài khoản "${u.name}"?\n\n• Người này sẽ bị đăng xuất và không đăng nhập được nữa.\n• OKR, báo cáo tuần, công việc cũ vẫn được giữ nguyên.\n• Có thể mở khoá lại bất cứ lúc nào.`)) return;
    } else {
      const m = u.managerId ? user(u.managerId) : null;
      if(m && m.name !== '?' && !isActive(m)){ toast(`Cấp trên trực tiếp của ${u.name} (${m.name}) đang bị khoá. Hãy sửa cấp trên trước khi mở khoá.`, 'error'); return; }
    }
    mutate('setUserActive', { id, active }, () => { u.active = !!active; }, active ? `Đã mở khoá tài khoản ${u.name}.` : `Đã khoá tài khoản ${u.name}.`);
  },
  deleteUser(id){
    if(!isDir()) return;
    const u = DB.users.find(x => x.id === id); if(!u || id === session()) return;
    if(staffOf(id).length){ toast(`${u.name} còn người trực thuộc, không thể xoá.`, 'error'); return; }
    const used = DB.okrs.some(o => o.ownerId === id || o.createdBy === id) || DB.reports.some(r => r.userId === id || r.comments.some(c => c.authorId === id)) || DB.tasks.some(t => t.assigneeId === id);
    if(used){ toast(`${u.name} đã có OKR, báo cáo hoặc công việc nên không xoá được. Hãy dùng nút Khoá để giữ lại lịch sử.`, 'error'); return; }
    if(!confirm(`Xoá hẳn tài khoản "${u.name}" (${u.username})? Thao tác này không hoàn tác được.`)) return;
    mutate('deleteUser', { id }, () => { DB.users = DB.users.filter(x => x.id !== id); }, `Đã xoá tài khoản ${u.name}.`);
  },
  onRoleChange(id){
    const role = document.getElementById('uf-role').value, cur = document.getElementById('uf-manager').value;
    document.getElementById('uf-manager').innerHTML = parentOptions(role, id, cur);
    document.getElementById('uf-manager-hint-box').innerHTML = parentHint(role, id);
    document.getElementById('uf-manager-label').textContent = 'Cấp trên trực tiếp' + (PARENT_ROLE[role] ? ` (${ROLES[PARENT_ROLE[role]].t})` : '');
  },
  setCycle(id){ state.cycleId = id; state.reportId = null; render(); },
  addKrRow(){ document.getElementById('of-krs').insertAdjacentHTML('beforeend', krRowHTML()); const rows = document.querySelectorAll('.kr-title'); if(rows.length) rows[rows.length-1].focus(); },
  submitOkr(id){
    const title = document.getElementById('of-title').value.trim();
    if(!title){ toast('Vui lòng nhập Mục tiêu.', 'error'); return; }
    const krs = [...document.querySelectorAll('.kr-row')].map(row => ({
      id: row.dataset.id || uid(), title: row.querySelector('.kr-title').value.trim(),
      baseline: Number(row.querySelector('.kr-baseline').value) || 0, targetRaw: row.querySelector('.kr-target').value.trim(),
      unit: row.querySelector('.kr-unit').value.trim() })).filter(k => k.title || k.unit || k.targetRaw);   // bỏ dòng trống hoàn toàn
    if(!krs.length){ toast('Cần ít nhất 1 Kết quả then chốt.', 'error'); return; }
    for(const k of krs){
      if(!k.title){ toast('Có KR chưa nhập tên.', 'error'); return; }
      if(k.targetRaw === '' || Number.isNaN(Number(k.targetRaw))){ toast(`KR "${k.title}" chưa có giá trị mục tiêu.`, 'error'); return; }
      k.target = Number(k.targetRaw); delete k.targetRaw;
      if(!k.unit){ toast(`KR "${k.title}" chưa có đơn vị đo.`, 'error'); return; }
      if(k.target === k.baseline){ toast(`KR "${k.title}": mục tiêu phải khác giá trị đầu kỳ.`, 'error'); return; }
    }
    const old = id ? DB.okrs.find(o => o.id === id) : null;
    const sel = document.getElementById('of-owner');
    const ownerId = sel ? sel.value : session();
    if(!(ownerId === session() || canManage(ownerId))){ toast('Bạn chỉ tạo được OKR cho chính mình hoặc nhân viên trực thuộc.', 'error'); return; }
    const cycleId = document.getElementById('of-cycle').value;
    const approved = canManage(ownerId);                 // quản lý trực tiếp / Giám đốc → duyệt ngay
    const now = new Date().toISOString();
    // giữ giá trị hiện tại của KR cũ; KR mới bắt đầu từ baseline
    krs.forEach(k => { const ok = old && old.krs.find(x => x.id === k.id); k.current = ok ? Number(ok.current) : k.baseline; });
    const o = { id: id || uid(), ownerId, title, cycleId, status: approved ? 'approved' : 'pending', createdBy: old ? old.createdBy : session(), reviewNote: approved && old ? old.reviewNote : '', updatedAt: now, krs };
    A.closeModal(); state.view = 'okrs'; state.okrStatus = 'all';
    mutate('saveOKR', { okr:o }, () => { const i = DB.okrs.findIndex(x => x.id === o.id); if(i >= 0) DB.okrs[i] = o; else DB.okrs.push(o); },
      approved ? (id ? 'Đã lưu OKR.' : 'Đã tạo OKR (đã duyệt).') : (id ? 'Đã lưu, OKR chuyển về Chờ duyệt.' : 'Đã gửi OKR chờ quản lý duyệt.'));
  },
  reviewOkr(id, status){
    const o = DB.okrs.find(o => o.id === id); if(!o || !canReviewOkr(o)){ toast('Bạn không có quyền duyệt OKR này.', 'error'); return; }
    const note = document.getElementById('rv-note').value.trim();
    if(status === 'rejected' && !note){ toast('Vui lòng nhập lý do từ chối.', 'error'); return; }
    const now = new Date().toISOString();
    A.closeModal();
    mutate('reviewOKR', { id, status, reviewNote:note, updatedAt:now }, () => { o.status = status; o.reviewNote = note; o.updatedAt = now; },
      status === 'approved' ? 'Đã duyệt OKR.' : 'Đã từ chối, nhân viên sẽ thấy lý do để sửa lại.');
  },
  deleteOkr(id){
    const o = DB.okrs.find(o => o.id === id); if(!o || !canDeleteOkr(o)) return;
    const n = DB.reports.filter(r => r.okrId === id).length;
    if(n){ toast(`Không thể xoá: đã có ${n} báo cáo tuần gắn với OKR này.`, 'error'); return; }
    if(!confirm('Xoá OKR này cùng toàn bộ KR?')) return;
    mutate('deleteOKR', { id }, () => { DB.okrs = DB.okrs.filter(o => o.id !== id); DB.tasks.forEach(t => { if(t.okrId === id) t.okrId = null; }); }, 'Đã xoá OKR.');
  },
  fillQuarter(q){
    const base = document.getElementById('cy-start').value ? fromISO(document.getElementById('cy-start').value) : new Date();
    let y = base.getFullYear(); const curQ = Math.floor(new Date().getMonth()/3) + 1; if(q < curQ && y === new Date().getFullYear() && !document.getElementById('cy-start').value) y += 1;
    document.getElementById('cy-name').value = `Q${q}/${y}`;
    document.getElementById('cy-start').value = toISO(new Date(y, (q-1)*3, 1));
    document.getElementById('cy-end').value = toISO(new Date(y, q*3, 0));
  },
  editCycle(id){
    const c = DB.cycles.find(c => c.id === id);
    document.getElementById('cy-form-title').textContent = 'Sửa chu kỳ: ' + c.name;
    document.getElementById('cy-id').value = c.id; document.getElementById('cy-name').value = c.name;
    document.getElementById('cy-start').value = c.start; document.getElementById('cy-end').value = c.end; document.getElementById('cy-active').checked = !!c.active;
    document.getElementById('cy-name').focus();
  },
  saveCycle(){
    const id = document.getElementById('cy-id').value || uid(), name = document.getElementById('cy-name').value.trim(), start = document.getElementById('cy-start').value, end = document.getElementById('cy-end').value, active = document.getElementById('cy-active').checked;
    if(!name || !start || !end){ toast('Nhập đủ tên, ngày bắt đầu và kết thúc.', 'error'); return; }
    if(end < start){ toast('Ngày kết thúc phải sau ngày bắt đầu.', 'error'); return; }
    const c = { id, name, start, end, active };
    A.closeModal();
    mutate('saveCycle', { cycle:c }, () => {
      const i = DB.cycles.findIndex(x => x.id === id); if(i >= 0) DB.cycles[i] = { ...DB.cycles[i], ...c }; else DB.cycles.push(c);
      if(active) DB.cycles.forEach(x => { x.active = x.id === id; }); else if(!DB.cycles.some(x => x.active)) DB.cycles[i >= 0 ? i : DB.cycles.length-1].active = true;
      state.cycleId = active ? id : state.cycleId;
    }, 'Đã lưu chu kỳ.');
  },
  setActiveCycle(id){ A.closeModal(); state.cycleId = id; mutate('setActiveCycle', { id }, () => { DB.cycles.forEach(x => { x.active = x.id === id; }); }, 'Đã kích hoạt chu kỳ.'); },
  deleteCycle(id){
    if(DB.okrs.some(o => o.cycleId === id)){ toast('Chu kỳ đang có OKR, không thể xoá.', 'error'); return; }
    if(!confirm('Xoá chu kỳ này?')) return;
    A.closeModal(); mutate('deleteCycle', { id }, () => { DB.cycles = DB.cycles.filter(c => c.id !== id); if(state.cycleId === id) state.cycleId = null; }, 'Đã xoá chu kỳ.');
  },
  renderKrInputs(){
    const o = DB.okrs.find(o => o.id === document.getElementById('rf-okr').value);
    const sent = sentKrIds(o.id);
    document.getElementById('rf-krs').innerHTML = (sent.size && o.krs.every(k => sent.has(k.id)) ? '<div class="text-[13px] text-amber-700 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2">Tất cả KR của mục tiêu này đã được báo cáo trong tuần này.</div>' : '') + o.krs.map(k => sent.has(k.id) ? `
      <div class="kr-card-sent border border-gray-200 rounded-lg px-3 py-2.5 bg-gray-50 flex items-center gap-3 opacity-70">
        <span class="text-green-600">${I.check}</span><div class="flex-1 min-w-0 text-slate-700 font-medium">${esc(k.title)}</div><span class="text-[12px] text-gray-500">Đã báo cáo tuần này</span>
      </div>` : `
      <div class="kr-card border border-gray-200 rounded-lg" data-kr="${k.id}">
        <label class="flex items-center gap-3 px-3 py-2.5 cursor-pointer">
          <input type="checkbox" class="checkbox kr-pick" onchange="A.toggleKr('${k.id}', this.checked)">
          <div class="flex-1 min-w-0"><div class="text-slate-800 font-medium">${esc(k.title)}</div><div class="text-[12px] text-gray-500">Đầu kỳ ${num(k.baseline)} · Hiện tại ${num(k.current)} · Mục tiêu ${num(k.target)} ${esc(k.unit)}</div></div>
        </label>
        <div class="kr-body hidden border-t border-gray-100 p-4 space-y-4 bg-gray-50/50">
          <div class="flex items-center gap-3"><label class="label !mb-0 w-40">Giá trị hiện tại</label><input type="number" min="0" step="any" class="input !w-36 kr-input text-right" value="${k.current}"><span class="text-gray-500 text-[12.5px]">${esc(k.unit)}</span></div>
          <div><label class="label">Đánh giá / Công việc đã thực hiện cho KR này <span class="text-red-500">*</span></label><textarea class="input kr-work" placeholder="- Việc 1...&#10;- Việc 2..."></textarea></div>
          <div class="grid md:grid-cols-2 gap-4">
            <div><label class="label">Vấn đề / Rào cản</label><textarea class="input kr-issues" placeholder="Khó khăn, điểm nghẽn..."></textarea></div>
            <div><label class="label">Nguyên nhân</label><textarea class="input kr-causes" placeholder="Vì sao xảy ra vấn đề..."></textarea></div>
          </div>
          <div>
            <div class="flex items-center justify-between mb-1.5"><label class="label !mb-0">Kế hoạch / Hành động tuần tiếp theo</label><button type="button" class="btn btn-ghost btn-sm" onclick="A.addSolRow('${k.id}')">${I.plus} Thêm giải pháp</button></div>
            <div class="kr-sols space-y-2"></div>
          </div>
        </div>
      </div>`).join('');
  },
  toggleKr(krId, on){
    const card = document.querySelector(`.kr-card[data-kr="${krId}"]`); if(!card) return;
    card.querySelector('.kr-body').classList.toggle('hidden', !on);
    card.classList.toggle('border-base-500', on);
    if(on && !card.querySelector('.sol-row')) A.addSolRow(krId);
    if(on) card.querySelector('.kr-work').focus();
  },
  addSolRow(krId){
    const card = document.querySelector(`.kr-card[data-kr="${krId}"]`); if(!card) return;
    card.querySelector('.kr-sols').insertAdjacentHTML('beforeend', `
      <div class="sol-row flex items-center gap-2 fade-in">
        <input class="input sol-text flex-1" placeholder="Hành động cụ thể cho tuần tới...">
        <input type="date" class="input sol-due !w-40" value="${toISO(addDays(weekStart(isoWeek(new Date()).week, isoWeek(new Date()).year), 11))}">
        <button class="text-gray-400 hover:text-red-600 p-1.5" onclick="this.closest('.sol-row').remove()">${I.x}</button>
      </div>`);
    const rows = card.querySelectorAll('.sol-text'); if(rows.length) rows[rows.length-1].focus();
  },
  submitReport(){
    const cw = isoWeek(new Date());
    const okrId = document.getElementById('rf-okr').value;
    const o = DB.okrs.find(o => o.id === okrId);
    const picked = [...document.querySelectorAll('.kr-card')].filter(c => c.querySelector('.kr-pick').checked);
    if(!picked.length){ toast('Vui lòng tick chọn ít nhất 1 KR cần báo cáo.', 'error'); return; }
    const sent = sentKrIds(okrId);
    if(picked.some(c => sent.has(c.dataset.kr))){ toast('Có KR đã được báo cáo trong tuần này rồi.', 'error'); return; }
    const krUpdates = [];
    for(const c of picked){
      const k = o.krs.find(k => k.id === c.dataset.kr);
      const work = c.querySelector('.kr-work').value.trim();
      if(!work){ toast(`KR "${k.title}": vui lòng nhập đánh giá / công việc đã thực hiện.`, 'error'); return; }
      krUpdates.push({ krId:k.id, value:Number(c.querySelector('.kr-input').value) || 0, work, issues:c.querySelector('.kr-issues').value.trim(), causes:c.querySelector('.kr-causes').value.trim(),
        solutions:[...c.querySelectorAll('.sol-row')].map(row => ({ id:uid(), krId:k.id, text:row.querySelector('.sol-text').value.trim(), due:row.querySelector('.sol-due').value })).filter(s => s.text) });
    }
    const solutions = krUpdates.flatMap(ku => ku.solutions);
    // Các trường tổng hợp (work/issues/causes) giữ để tương thích với bản cũ & bot/báo cáo đọc dữ liệu thô
    const joinKr = f => krUpdates.filter(ku => ku[f]).map(ku => `[${o.krs.find(k => k.id === ku.krId).title}]\n${ku[f]}`).join('\n\n');
    const now = new Date().toISOString();
    const r = { id:uid(), userId:session(), week:cw.week, year:cw.year, okrId, createdAt:now, krUpdates, work:joinKr('work'), issues:joinKr('issues'), causes:joinKr('causes'), solutions, comments:[] };
    const tasks = solutions.map(s => ({ id:uid(), title:s.text, assigneeId:session(), reportId:r.id, solutionId:s.id, okrId, week:cw.week, year:cw.year, due:s.due, status:'todo', createdAt:now }));
    A.closeModal(); state.view = 'checkin'; state.ckWeek = 'all'; state.ckUser = 'all'; state.reportId = r.id;
    mutate('addReport', { report:r, tasks }, () => {
      krUpdates.forEach(ku => { const k = o.krs.find(k => k.id === ku.krId); if(k) k.current = ku.value; });
      DB.reports.push(r); tasks.forEach(t => DB.tasks.push(t));
    }, `Đã gửi báo cáo ${krUpdates.length} KR${solutions.length ? ` và tạo ${solutions.length} công việc mới` : ''}.`);
  },
  deleteReport(id){
    if(!confirm('Xoá báo cáo này? Các công việc được tạo từ báo cáo cũng sẽ bị xoá.')) return;
    state.reportId = null;
    mutate('deleteReport', { id }, () => { DB.reports = DB.reports.filter(r => r.id !== id); DB.tasks = DB.tasks.filter(t => t.reportId !== id); }, 'Đã xoá báo cáo.');
  },
  addComment(rid){
    const r = DB.reports.find(r => r.id === rid);
    if(!r || !(r.userId === session() || canManage(r.userId))){ toast('Chỉ quản lý trực tiếp hoặc Giám đốc được phản hồi báo cáo này.', 'error'); return; }
    const ta = document.getElementById('cm-' + rid), text = ta.value.trim();
    if(!text){ toast('Vui lòng nhập nội dung phản hồi.', 'error'); return; }
    const c = { id:uid(), reportId:rid, authorId:session(), text, createdAt:new Date().toISOString(), acknowledged:false };
    const directive = isDirective(c.authorId, r.userId);
    mutate('addComment', { comment:c }, () => { r.comments.push(c); }, directive ? 'Đã gửi chỉ đạo cho nhân viên.' : 'Đã gửi trả lời.');
  },
  ack(rid, cid){
    const ackAt = new Date().toISOString();
    mutate('ackComment', { id:cid, ackAt }, () => { const c = DB.reports.find(r => r.id === rid).comments.find(c => c.id === cid); c.acknowledged = true; c.ackAt = ackAt; }, 'Đã xác nhận: Đã đọc và hiểu chỉ đạo.');
  },
  toggleTask(id){ const t = DB.tasks.find(t => t.id === id); if(!t || !canSeeTask(t)) return; const s = t.status === 'done' ? 'todo' : 'done'; mutate('updateTask', { id, patch:{ status:s } }, () => { t.status = s; }); },
  setTaskStatus(id, s){ const t = DB.tasks.find(t => t.id === id); if(!t || !canSeeTask(t)) return; mutate('updateTask', { id, patch:{ status:s } }, () => { t.status = s; }); },
  deleteTask(id){ const t = DB.tasks.find(t => t.id === id); if(!t || !canSeeTask(t)) return; if(!confirm('Xoá công việc này?')) return; mutate('deleteTask', { id }, () => { DB.tasks = DB.tasks.filter(t => t.id !== id); }, 'Đã xoá công việc.'); },
  submitTask(){
    const title = document.getElementById('tf-title').value.trim();
    if(!title){ toast('Vui lòng nhập tên công việc.', 'error'); return; }
    const cw = isoWeek(new Date());
    const sel = document.getElementById('tf-user');
    const assigneeId = sel ? sel.value : session();
    if(!(assigneeId === session() || canManage(assigneeId))){ toast('Bạn chỉ giao được việc cho chính mình hoặc nhân viên trực thuộc.', 'error'); return; }
    const t = { id:uid(), title, assigneeId, reportId:null, solutionId:null, okrId:document.getElementById('tf-okr').value || null, week:cw.week, year:cw.year, due:document.getElementById('tf-due').value, status:'todo', createdAt:new Date().toISOString() };
    A.closeModal();
    mutate('addTask', { task:t }, () => { DB.tasks.push(t); }, `Đã thêm công việc${assigneeId !== session() ? ' cho ' + user(assigneeId).name : ''}.`);
  },
  saveUser(id){
    if(!isDir()) return;
    const g = k => document.getElementById(k).value.trim();
    const old = id ? DB.users.find(x => x.id === id) : null;
    const u = { id: id || 'u' + uid(), name:g('uf-name'), username:g('uf-username'), role:g('uf-role'), managerId:g('uf-manager'), dept:g('uf-dept'), title:g('uf-title'), password:document.getElementById('uf-password').value };
    if(!u.name || !u.username){ toast('Nhập đủ họ tên và tên đăng nhập.', 'error'); return; }
    if(DB.users.some(x => x.username === u.username && x.id !== u.id)){ toast(`Tên đăng nhập "${u.username}" đã được dùng.`, 'error'); return; }
    if(!old && !u.password){ toast('Tài khoản mới cần có mật khẩu.', 'error'); return; }
    if(old && old.id === session() && u.role !== 'director'){ toast('Không thể tự bỏ vai trò Giám đốc của chính mình.', 'error'); return; }
    if(u.role === 'director') u.managerId = '';
    if(u.managerId === u.id){ toast('Không thể tự làm cấp trên của chính mình.', 'error'); return; }
    if(u.managerId && user(u.managerId).role !== PARENT_ROLE[u.role]){ toast(`${ROLES[u.role].t} phải trực thuộc một ${ROLES[PARENT_ROLE[u.role]].t}.`, 'error'); return; }
    if(old && old.role !== u.role){ const wrong = staffOf(old.id).filter(x => PARENT_ROLE[x.role] !== u.role).length; if(wrong){ toast(`Còn ${wrong} người trực thuộc không hợp với vai trò mới. Hãy chuyển họ sang cấp trên khác trước.`, 'error'); return; } }
    u.color = old ? old.color : PALETTE[DB.users.length % PALETTE.length];
    if(!u.password) delete u.password;
    A.closeModal();
    mutate('saveUser', { user:u }, () => {
      const rec = { ...u };
      if(online()) delete rec.password;                 // mật khẩu chỉ lưu trên Sheet
      const i = DB.users.findIndex(x => x.id === u.id);
      if(i >= 0) DB.users[i] = { ...DB.users[i], ...rec }; else DB.users.push(rec);
    }, old ? 'Đã cập nhật nhân sự.' : 'Đã thêm nhân sự.');
  },
};

/* ---------- Khởi động ---------- */
// Gắn solutionId cho task mẫu (để liên kết checkbox trong chi tiết báo cáo)
function linkSeedTasks(){ let changed = false; DB.tasks.forEach(t => { if(t.reportId && !t.solutionId){ const r = DB.reports.find(r => r.id === t.reportId); const s = r && r.solutions.find(s => s.text === t.title); if(s){ t.solutionId = s.id; changed = true; } } }); if(changed) save(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') A.cancelModal(); });
['input','change'].forEach(ev => document.getElementById('modal').addEventListener(ev, () => { modalDirty = true; }));
async function init(){
  load(); linkSeedTasks();
  if(online()){
    if(session() && !token()) localStorage.removeItem(SESSION_KEY);       // phiên cũ (trước v3) không có token → đăng nhập lại
    document.getElementById('app').innerHTML = `<div class="min-h-screen flex items-center justify-center text-gray-500 text-sm"><div class="flex items-center gap-3"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>Đang tải dữ liệu...</div></div>`;
    try { await apiLoad(); }
    catch(e){ if(e.auth){ localStorage.removeItem(SESSION_KEY); DB.tasks = []; save(); toast(e.message, 'error'); } else toast('Không tải được dữ liệu mới, đang dùng dữ liệu đã lưu trên máy. ' + e.message, 'error'); }
  }
  render();
}
init();
</script>
